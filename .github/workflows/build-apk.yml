
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install packages
        run: npm install

      - name: Prepare website
        run: |
          mkdir -p www
          cp index.html style.css app.js Manifest.webmanifest sw.js www/
          cp -r icon-192.png Icon-512.png Icon.svg Apple-touch-icon.png www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EFOTBALL-LEAGUE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
